---
# Stable address for the Advice for Students doc. Change the target in _config.yml (links.advice).
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Advice for students · {{ site.title }}</title>
  <meta http-equiv="refresh" content="0; url={{ site.links.advice }}">
  <link rel="canonical" href="{{ site.links.advice }}">
  <meta name="robots" content="noindex">
  <script>location.replace("{{ site.links.advice }}");</script>
</head>
<body>
  <p>Redirecting to <a href="{{ site.links.advice }}">Advice for students</a>…</p>
</body>
</html>
