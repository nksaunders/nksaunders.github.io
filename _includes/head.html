  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script>
    // Set the theme before first paint so there is no flash. Day is the default.
    try { var t = localStorage.getItem('theme'); if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preload" href="/assets/fonts/charis-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css?v={{ site.time | date: '%s' }}">
  <script src="/assets/js/site.js?v={{ site.time | date: '%s' }}" defer></script>
  {% if site.goatcounter and page.analytics != false %}
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {% endif %}
