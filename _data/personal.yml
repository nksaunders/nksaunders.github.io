films_intro: >-
  Alongside my BS in Physics & Astronomy, I earned a BA in Cinema Studies. 
  Film history fascinates me, I believe movies give you the clearest indication of what occupies people's minds in a given place and time.<br>
  Here, you can find my current favorites. Movies I can't get out of my head. Below, I list my top 10 films for each decade (back to the 1920s).<br>
  <i>Disclaimer: my taste is subjective and sometimes bad. I just like watching movies.</i>

