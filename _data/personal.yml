intro: >-
  When the dome is closed, I spend most of my time with The Creatures (pictured below) who live with me and my partner, Brittany. 
  You'll often find us watching movies. I de-stress by cooking an elaborate meal and cleaning the kitchen. 
  I play the violin (too infrequently), but more often I cover my favorite sad songs on guitar. 

